.container{width:min(920px,92%);margin:0 auto;padding:45px 0 70px}
.header{text-align:center;margin-bottom:32px}.badge{display:inline-block;color:#ff5a5a;border:1px solid #5c2020;background:#1b0b0b;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
h1{font-size:clamp(32px,6vw,54px);margin:16px 0 8px}.header p{color:var(--muted);margin:0;font-size:15px}
.card{background:linear-gradient(145deg,#121212,#0d0d0d);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 20px 60px #0008}
.section{padding:4px 0 25px}.section+.section{border-top:1px solid var(--border);padding-top:28px}
.section h2{font-size:18px;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{margin-bottom:16px}.field.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px} .optional{color:#777;font-weight:400}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:11px;color:var(--text);padding:13px 14px;outline:none;font:inherit;transition:.2s}
textarea{min-height:115px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #d4141420}
.hint{font-size:12px;color:#777;margin-top:7px}
.checkbox{display:flex;gap:10px;align-items:flex-start;color:#aaa;font-size:13px;line-height:1.5}.checkbox input{width:auto;margin-top:3px;accent-color:var(--accent)}
button{width:100%;border:0;border-radius:12px;padding:15px;background:linear-gradient(135deg,#0866ff,#1495ff);color:white;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 10px 25px #0866ff45}button:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 12px 30px #0866ff60}
.success{display:none;text-align:center;padding:35px}.success h2{margin-top:0;color:#ff5a5a}.success p{color:#aaa}
@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:20px}.container{padding-top:25px}}

</head>
<body>
<main class="container">
<header class="header">
  <span class="badge">Candidature RP</span>
  <h1>Rejoindre le gang</h1>
  <p>Prends le temps de répondre sérieusement à chaque question.</p>
</header>

<section class="card" id="formCard">
<form id="applicationForm">
  <div class="section">
    <h2>👤 Informations IRL</h2>
    <div class="grid">
      <div class="field"><label for="pseudo">Prénom / Pseudo</label><input id="pseudo" name="pseudo" required placeholder="Ton prénom ou pseudo"></div>
      <div class="field"><label for="age">Âge IRL</label><input id="age" name="age" type="number" min="13" max="99" required placeholder="Ex. 18"></div>
      <div class="field full"><label for="experience">Depuis combien de temps fais-tu du RP ?</label><input id="experience" name="experience" required placeholder="Ex. 2 ans"></div>
      <div class="field full"><label for="availability">Quelles sont tes disponibilités ?</label><textarea id="availability" name="availability" required placeholder="Ex. Tous les soirs à partir de 18h..."></textarea></div>
    </div>
  </div>

  <div class="section">
    <h2>🎭 Informations RP</h2>
    <div class="grid">
      <div class="field"><label for="rpname">Nom et prénom RP</label><input id="rpname" name="rpname" required placeholder="Ex. Tony Rossi"></div>
      <div class="field"><label for="rpage">Âge RP</label><input id="rpage" name="rpage" type="number" min="13" max="100" required placeholder="Ex. 27"></div>
      <div class="field full"><label for="story">Histoire de ton personnage</label><textarea id="story" name="story" required placeholder="Raconte brièvement son parcours..."></textarea></div>
      <div class="field full"><label for="why">Pourquoi ton personnage souhaite-t-il rejoindre le gang ?</label><textarea id="why" name="why" required></textarea></div>
      <div class="field full"><label for="motivation">Quelles sont ses motivations ?</label><textarea id="motivation" name="motivation" required></textarea></div>
      <div class="field"><label for="qualities">Quelles sont ses qualités ?</label><textarea id="qualities" name="qualities" required></textarea></div>
      <div class="field"><label for="flaws">Quels sont ses défauts ?</label><textarea id="flaws" name="flaws" required></textarea></div>
      <div class="field full"><label for="tension">Comment réagirait-il face à une situation tendue ?</label><textarea id="tension" name="tension" required></textarea></div>
      <div class="field full"><label for="past">A-t-il déjà eu une expérience dans un gang / une organisation RP ?</label><textarea id="past" name="past" required></textarea></div>
      <div class="field full"><label for="contribution">Que pourrait-il apporter au gang ?</label><textarea id="contribution" name="contribution" required></textarea></div>
    </div>
  </div>

  <div class="section">
    <h2>🎬 Mise en situation RP</h2>
    <div class="field">
      <label for="scenario">Un membre du gang te demande de l'accompagner pour une mission, mais tu ne connais pas les détails. Comment ton personnage réagit-il ?</label>
      <textarea id="scenario" name="scenario" required></textarea>
    </div>
    <div class="field">
      <label for="scenario2">Un autre membre provoque ton personnage devant plusieurs personnes. Comment réagit-il sans nuire au RP du groupe ?</label>
      <textarea id="scenario2" name="scenario2" required></textarea>
    </div>
  </div>

  <div class="section">
    <h2>📩 Pour terminer</h2>
    <div class="field"><label for="presentation">Présente ton personnage en quelques lignes.</label><textarea id="presentation" name="presentation" required></textarea></div>
    <div class="field"><label for="accept">Pourquoi devrait-on accepter ta candidature ?</label><textarea id="accept" name="accept" required></textarea></div>
    <label class="checkbox"><input type="checkbox" required> <span>Je confirme que les informations fournies sont sincères et que je respecte les règles du serveur.</span></label>
  </div>

  <button type="submit">Envoyer ma candidature</button>
</form>

<div class="success" id="success">
  <h2>✅ Candidature envoyée</h2>
  <p>Merci ! Ta candidature a bien été prise en compte.</p>
</div>
</section>
</main>

<script>
document.getElementById('applicationForm').addEventListener('submit', function(e){
  e.preventDefault();
  this.style.display='none';
  document.getElementById('success').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
